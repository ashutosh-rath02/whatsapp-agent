# Run the agent as a persistent, auto-restarting service.
#   docker compose up -d --build
#   docker compose logs -f        # scan the QR shown here on first run
services:
  whatsapp-agent:
    build:
      context: .
      args:
        # Set to "true" to bake in ffmpeg + yt-dlp for Instagram reel audio.
        INSTALL_MEDIA_TOOLS: "false"
    image: whatsapp-agent
    container_name: whatsapp-agent
    env_file: .env
    restart: unless-stopped
    init: true                # reap orphaned Chromium child processes
    shm_size: "512m"          # headroom for headless Chromium
    ports:
      # Web dashboard. Host:Container. Requires WEB_PASSWORD set in .env to bind
      # publicly, and the port opened in your EC2 security group (ideally to your IP).
      - "8080:8080"
    volumes:
      - wa-session:/data      # persists the WhatsApp session + saved data across restarts

volumes:
  wa-session:
